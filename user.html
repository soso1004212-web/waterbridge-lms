<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaterBridge LMS</title>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Pretendard',sans-serif;
}

body{
background:#f5f7fb;
}

.header{
height:70px;
background:#0f172a;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 30px;
}

.logo{
font-size:24px;
font-weight:700;
}

.logout{
background:#dc2626;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
}

.container{
max-width:1400px;
margin:auto;
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h3{
font-size:14px;
color:#666;
margin-bottom:10px;
}

.value{
font-size:30px;
font-weight:700;
color:#2563eb;
}

.section{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
margin-bottom:25px;
}

.section h2{
margin-bottom:20px;
}

.notice{
padding:15px;
background:#f8fafc;
border-left:4px solid #2563eb;
margin-bottom:10px;
border-radius:10px;
}

.course-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.course-card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
overflow:hidden;
}

.course-thumbnail{
height:180px;
background:#dbeafe;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
}

.course-body{
padding:20px;
}

.course-title{
font-size:18px;
font-weight:700;
margin-bottom:10px;
}

.course-desc{
color:#666;
margin-bottom:15px;
}

.watch-btn{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

.progress-bar{
width:100%;
height:12px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.progress{
height:100%;
background:#22c55e;
width:65%;
}

.video-modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.video-box{
width:90%;
max-width:900px;
background:white;
padding:20px;
border-radius:15px;
}

.video-box iframe{
width:100%;
height:500px;
border:none;
}

.close-btn{
margin-top:15px;
background:#dc2626;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

</style>
</head>
<body>

<div class="header">

<div class="logo">
WaterBridge LMS
</div>

<button class="logout" onclick="logout()">
로그아웃
</button>

</div>

<div class="container">

<div class="cards">

<div class="card">
<h3>수강 강의</h3>
<div class="value">12</div>
</div>

<div class="card">
<h3>완료 강의</h3>
<div class="value">7</div>
</div>

<div class="card">
<h3>수강률</h3>
<div class="value">65%</div>
</div>

<div class="card">
<h3>포인트</h3>
<div class="value">3,200</div>
</div>

</div>

<div class="section">

<h2>내 정보</h2>

<p><strong>이름 :</strong> 홍길동</p>
<p><strong>등급 :</strong> 프리미엄 회원</p>
<p><strong>이메일 :</strong> user@test.com</p>

</div>

<div class="section">

<h2>공지사항</h2>

<div class="notice">
신규 강의 "LMS 마스터 과정"이 업로드되었습니다.
</div>

<div class="notice">
시스템 점검 예정 : 6월 20일 새벽 2시
</div>

</div>

<div class="section">

<h2>내 학습 현황</h2>

<p>WaterBridge 투자 과정</p>

<div class="progress-bar">
<div class="progress"></div>
</div>

<p style="margin-top:10px;">65% 완료</p>

</div>

<div class="section">

<h2>강의 목록</h2>

<div class="course-grid">

<div class="course-card">

<div class="course-thumbnail">
🎓
</div>

<div class="course-body">

<div class="course-title">
LMS 사용법 기초
</div>

<div class="course-desc">
회원관리와 강의 수강 방법
</div>

<button class="watch-btn"
onclick="openVideo('https://www.youtube.com/embed/dQw4w9WgXcQ')">
강의 시청
</button>

</div>

</div>

<div class="course-card">

<div class="course-thumbnail">
📚
</div>

<div class="course-body">

<div class="course-title">
고급 투자 전략
</div>

<div class="course-desc">
실전 자산관리 과정
</div>

<button class="watch-btn"
onclick="openVideo('https://www.youtube.com/embed/dQw4w9WgXcQ')">
강의 시청
</button>

</div>

</div>

</div>

</div>

</div>

<div class="video-modal" id="videoModal">

<div class="video-box">

<iframe id="videoFrame"
allowfullscreen>
</iframe>

<button class="close-btn"
onclick="closeVideo()">
닫기
</button>

</div>

</div>

<script>

function logout(){

location.href="login.html";

}

function openVideo(url){

document.getElementById("videoFrame").src=url;

document.getElementById("videoModal").style.display="flex";

}

function closeVideo(){

document.getElementById("videoFrame").src="";

document.getElementById("videoModal").style.display="none";

}

</script>

</body>
</html>
