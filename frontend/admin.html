<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Admin Panel - WaterBridge LMS</title>

<style>
body{
  font-family: Arial;
  background:#f5f7fb;
  padding:20px;
}

h1{
  margin-bottom:20px;
}

.box{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

input,button{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:1px solid #ddd;
}

button{
  cursor:pointer;
  background:#2563eb;
  color:white;
  border:none;
}

button:hover{
  background:#1d4ed8;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

th{
  background:#0f172a;
  color:white;
}

.badge{
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
}

.admin{
  background:#ef4444;
  color:white;
}

.user{
  background:#22c55e;
  color:white;
}
</style>
</head>
<body>

<h1>⚙️ WaterBridge Admin Panel</h1>

<div class="box">
  <h3>🔐 관리자 체크</h3>
  <p id="status">로딩중...</p>
</div>

<div class="box">
  <h3>📚 강의 추가</h3>
  <input id="courseId" placeholder="courseId">
  <input id="title" placeholder="강의명">
  <input id="desc" placeholder="설명">
  <button onclick="addCourse()">추가</button>
</div>

<div class="box">
  <h3>👥 유저 목록</h3>
  <button onclick="loadUsers()">새로고침</button>

  <table>
    <thead>
      <tr>
        <th>이름</th>
        <th>이메일</th>
        <th>role</th>
        <th>완료 강의</th>
        <th>포인트</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>
</div>

<script type="module">

import { auth, db } from "./firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  collection,
  getDocs,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* -------------------------
   로그인 + 관리자 체크
--------------------------*/
onAuthStateChanged(auth, async (user) => {

  if(!user){
    location.href = "index.html";
    return;
  }

  const snap = await getDoc(doc(db,"users",user.uid));

  if(!snap.exists()){
    document.getElementById("status").textContent = "유저 정보 없음";
    return;
  }

  const data = snap.data();

  if(data.role !== "admin"){
    document.body.innerHTML = "<h2>🚫 접근 권한 없음 (관리자 전용)</h2>";
    return;
  }

  document.getElementById("status").innerHTML =
    "✅ 관리자 로그인: " + data.name;
});

/* -------------------------
   강의 추가
--------------------------*/
window.addCourse = async function(){

  const id = document.getElementById("courseId").value;
  const title = document.getElementById("title").value;
  const desc = document.getElementById("desc").value;

  if(!id) return alert("courseId 입력");

  await setDoc(doc(db,"courses",id),{
    title,
    desc,
    createdAt: Date.now()
  });

  alert("강의 추가 완료");
};

/* -------------------------
   유저 목록
--------------------------*/
window.loadUsers = async function(){

  const snap = await getDocs(collection(db,"users"));
  const tbody = document.getElementById("userTable");

  tbody.innerHTML = "";

  snap.forEach(d => {

    const data = d.data();

    tbody.innerHTML += `
      <tr>
        <td>${data.name || ""}</td>
        <td>${data.email || ""}</td>
        <td>
          <span class="badge ${data.role === "admin" ? "admin":"user"}">
            ${data.role || "user"}
          </span>
        </td>
        <td>${(data.completedCourseIds || []).length}</td>
        <td>${data.point || 0}</td>
      </tr>
    `;
  });
};

</script>

</body>
</html>
