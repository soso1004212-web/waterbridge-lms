<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaterBridge LMS 관리자</title>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Pretendard',sans-serif;
}

body{
background:#f4f7fb;
display:flex;
height:100vh;
overflow:hidden;
}

.sidebar{
width:260px;
background:#0f172a;
color:white;
padding:25px;
display:flex;
flex-direction:column;
}

.logo{
font-size:24px;
font-weight:700;
margin-bottom:40px;
text-align:center;
}

.menu button{
width:100%;
padding:14px;
margin-bottom:10px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
font-size:15px;
transition:.3s;
}

.menu button:hover{
background:#2563eb;
}

.logout{
margin-top:auto;
background:#dc2626 !important;
}

.main{
flex:1;
padding:30px;
overflow-y:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.header h1{
font-size:28px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
font-size:15px;
color:#666;
margin-bottom:10px;
}

.card .value{
font-size:32px;
font-weight:700;
color:#2563eb;
}

.section{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
margin-bottom:25px;
display:none;
}

.section.active{
display:block;
}

.section h2{
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#f8fafc;
}

input,textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
margin-bottom:10px;
}

textarea{
height:120px;
resize:none;
}

.save-btn{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
}

.notice-list{
margin-top:20px;
}

.notice-item{
padding:12px;
background:#f8fafc;
margin-bottom:10px;
border-radius:10px;
}

</style>
</head>
<body>

<div class="sidebar">

<div class="logo">
WaterBridge LMS
</div>

<div class="menu">

<button onclick="showSection('dashboard')">
대시보드
</button>

<button onclick="showSection('members')">
회원관리
</button>

<button onclick="showSection('courses')">
강의관리
</button>

<button onclick="showSection('notice')">
공지사항
</button>

<button onclick="showSection('stats')">
통계
</button>

<button class="logout" onclick="logout()">
로그아웃
</button>

</div>

</div>

<div class="main">

<div class="header">
<h1>관리자 페이지</h1>
<div id="today"></div>
</div>

<div id="dashboard" class="section active">

<div class="cards">

<div class="card">
<h2>전체 회원</h2>
<div class="value">152</div>
</div>

<div class="card">
<h2>유료 회원</h2>
<div class="value">71</div>
</div>

<div class="card">
<h2>등록 강의</h2>
<div class="value">24</div>
</div>

<div class="card">
<h2>오늘 접속</h2>
<div class="value">58</div>
</div>

</div>

</div>

<div id="members" class="section">

<h2>회원 관리</h2>

<table>

<thead>
<tr>
<th>이름</th>
<th>이메일</th>
<th>등급</th>
<th>상태</th>
</tr>
</thead>

<tbody>

<tr>
<td>홍길동</td>
<td>hong@test.com</td>
<td>유료회원</td>
<td>활성</td>
</tr>

<tr>
<td>김철수</td>
<td>kim@test.com</td>
<td>일반회원</td>
<td>활성</td>
</tr>

</tbody>

</table>

</div>

<div id="courses" class="section">

<h2>강의 등록</h2>

<input type="text" id="courseTitle" placeholder="강의 제목">

<textarea id="courseDesc" placeholder="강의 설명"></textarea>

<button class="save-btn" onclick="saveCourse()">
강의 등록
</button>

<div id="courseList"></div>

</div>

<div id="notice" class="section">

<h2>공지사항 작성</h2>

<input type="text" id="noticeTitle" placeholder="공지 제목">

<textarea id="noticeContent" placeholder="공지 내용"></textarea>

<button class="save-btn" onclick="saveNotice()">
공지 등록
</button>

<div class="notice-list" id="noticeList"></div>

</div>

<div id="stats" class="section">

<h2>운영 통계</h2>

<table>

<tr>
<td>총 회원 수</td>
<td>152명</td>
</tr>

<tr>
<td>유료 회원</td>
<td>71명</td>
</tr>

<tr>
<td>오늘 로그인</td>
<td>58명</td>
</tr>

<tr>
<td>강의 수</td>
<td>24개</td>
</tr>

</table>

</div>

</div>

<script>

document.getElementById("today").innerHTML =
new Date().toLocaleString("ko-KR");

function showSection(id){

document.querySelectorAll(".section")
.forEach(section=>{
section.classList.remove("active");
});

document.getElementById(id)
.classList.add("active");

}

function logout(){

location.href="login.html";

}

function saveNotice(){

const title =
document.getElementById("noticeTitle").value;

const content =
document.getElementById("noticeContent").value;

if(!title || !content){

alert("내용을 입력하세요");
return;

}

const div=document.createElement("div");

div.className="notice-item";

div.innerHTML=
"<strong>"+title+"</strong><br>"+content;

document.getElementById("noticeList")
.prepend(div);

document.getElementById("noticeTitle").value="";
document.getElementById("noticeContent").value="";

}

function saveCourse(){

const title=
document.getElementById("courseTitle").value;

const desc=
document.getElementById("courseDesc").value;

if(!title || !desc){

alert("강의 내용을 입력하세요");
return;

}

const item=document.createElement("div");

item.className="notice-item";

item.innerHTML=
"<strong>"+title+"</strong><br>"+desc;

document.getElementById("courseList")
.prepend(item);

document.getElementById("courseTitle").value="";
document.getElementById("courseDesc").value="";

}

</script>

</body>
</html>
