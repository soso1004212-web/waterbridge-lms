<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Admin Panel - WaterBridge LMS</title>

<style>
body{
  font-family: Arial;
  background:#f5f7fb;
  padding:20px;
}

h1{
  margin-bottom:20px;
}

.box{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

input,button{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:1px solid #ddd;
}

button{
  cursor:pointer;
  background:#2563eb;
  color:white;
  border:none;
}

button:hover{
  background:#1d4ed8;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

th{
  background:#0f172a;
  color:white;
}

.badge{
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
}

.admin{
  background:#ef4444;
  color:white;
}

.user{
  background:#22c55e;
  color:white;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

/* 🔥 추가: 온라인 상태 스타일 */
.status{
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
}

.online{ background:#dcfce7; color:#16a34a; }
.offline{ background:#fee2e2; color:#dc2626; }

.user-row{
  display:flex;
  justify-content:space-between;
  padding:10px;
  border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<div class="topbar">
  <h1>⚙️ WaterBridge 관리자페이지</h1>
  <button onclick="logout()">로그아웃</button>
</div>

<!-- 관리자 상태 -->
<div class="box">
  <h3>🔐 관리자 체크</h3>
  <p id="status">로딩중...</p>
</div>

<!-- 강의 추가 -->
<div class="box">
  <h3>📚 강의 추가</h3>
  <input id="courseId" placeholder="courseId">
  <input id="title" placeholder="강의명">
  <input id="desc" placeholder="설명">
  <button onclick="addCourse()">추가</button>
</div>

<!-- 유저 목록 -->
<div class="box">
  <h3>👥 유저 목록</h3>
  <button onclick="loadUsers()">새로고침</button>

  <table>
    <thead>
      <tr>
        <th>이름</th>
        <th>이메일</th>
        <th>role</th>
        <th>완료 강의</th>
        <th>포인트</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>
</div>
<div class="box">
  <h3>🎥 실시간 강의 시청 현황</h3>
  <div id="liveCourses"></div>
</div>

<!-- 🔥 추가: 실시간 접속자 -->
<div class="box">
  <h3>🔥 실시간 접속자</h3>
  <div id="onlineUsers">로딩중...</div>
</div>

<script type="module">

import { auth, db } from "./firebase-config.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  collection,
  getDocs,
  doc,
  getDoc,
  setDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* -------------------------
   로그인 + 관리자 체크
--------------------------*/
let currentAdmin = null;

onAuthStateChanged(auth, async (user) => {

  if(!user){
    location.replace("/index.html");
    return;
  }

  const snap = await getDoc(doc(db,"users",user.uid));

  if(!snap.exists()){
    document.body.innerHTML = "<h2>유저 정보 없음</h2>";
    return;
  }

  const data = snap.data();

  if(data.role !== "admin"){
    document.body.innerHTML = "<h2>🚫 접근 권한 없음 (관리자 전용)</h2>";
    return;
  }

  currentAdmin = user;

await setDoc(doc(db, "users", user.uid), {
  online: true,
  lastSeen: Date.now()
}, { merge: true });

  document.getElementById("status").innerHTML =
    "✅ 관리자 로그인: " + (data.name || user.email);

  startOnlineListener(); // 🔥 접속자 실시간 시작
});

/* -------------------------
   로그아웃
--------------------------*/
window.logout = async function(){

const user = auth.currentUser;

  // 🔥 1. 온라인 상태 끄기 (핵심)
  if (user) {
    const { doc, updateDoc } = await import(
      "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js"
    );

    await updateDoc(doc(db, "users", user.uid), {
      online: false,
      lastSeen: Date.now()
    });
  }

  await signOut(auth);
  location.replace("/index.html");
};


/* -------------------------
   강의 추가
--------------------------*/
window.addCourse = async function(){

  const id = document.getElementById("courseId").value;
  const title = document.getElementById("title").value;
  const desc = document.getElementById("desc").value;

  if(!id) return alert("courseId 입력");

  await setDoc(doc(db,"courses",id),{
    title,
    desc,
    createdAt: Date.now()
  });

  alert("강의 추가 완료");
};


/* -------------------------
   유저 목록
--------------------------*/
window.loadUsers = async function(){

function startLiveWatching(){

  const box = document.getElementById("liveCourses");

  onSnapshot(collection(db, "users"), (snap) => {

    box.innerHTML = "";

    snap.forEach(docu => {
      const u = docu.data();

      if(u.online && u.currentCourse){

        const div = document.createElement("div");

        div.style.padding = "10px";
        div.style.borderBottom = "1px solid #eee";

        div.innerHTML = `
          <b>${u.name || "이름 없음"}</b><br>
          📚 현재 강의: <b>${u.currentCourseTitle || u.currentCourse}</b><br>
          🟢 상태: ONLINE
        `;

        box.appendChild(div);
      }
    });

  });
}



  const snap = await getDocs(collection(db,"users"));
  const tbody = document.getElementById("userTable");

  tbody.innerHTML = "";

  snap.forEach(d => {

    const data = d.data();

    tbody.innerHTML += `
      <tr>
        <td>${data.name || ""}</td>
        <td>${data.email || ""}</td>
        <td>
          <span class="badge ${data.role === "admin" ? "admin":"user"}">
            ${data.role || "user"}
          </span>
        </td>
        <td>${(data.completedCourseIds || []).length}</td>
        <td>${data.point || 0}</td>
      </tr>
    `;
  });
};


/* -------------------------
   🔥 실시간 접속자 (추가 핵심)
--------------------------*/
function startOnlineListener(){

  const box = document.getElementById("onlineUsers");

  onSnapshot(collection(db,"users"), (snap) => {

    box.innerHTML = "";

    let count = 0;

    snap.forEach(docu => {
      const u = docu.data();

      const isOnline = u.online === true;

      if(isOnline) count++;

      if(isOnline){
        const div = document.createElement("div");
        div.className = "user-row";

        div.innerHTML = `
          <div>
            <b>${u.name || "이름 없음"}</b><br>
            <small>${u.email || ""}</small>
          </div>

          <div>
            <span class="status online">ONLINE</span><br>
            <small>${u.lastSeen ? new Date(u.lastSeen).toLocaleTimeString() : "-"}</small>
          </div>
        `;

        box.appendChild(div);
      }
    });

    if(count === 0){
      box.innerHTML = "현재 접속자 없음";
    } else {
      box.innerHTML =
        `<div style="margin-bottom:10px;font-weight:bold;">
          현재 접속자: ${count}명
        </div>` + box.innerHTML;
    }
  });
}

window.addEventListener("beforeunload", async () => {
  const user = auth.currentUser;
  if (!user) return;

  const { updateDoc, doc } = await import(
    "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js"
  );

  await updateDoc(doc(db, "users", user.uid), {
    online: false,
    lastSeen: Date.now()
  });
});

</script>

</body>
</html>
