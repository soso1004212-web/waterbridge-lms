<body>

<div class="container">

<div class="logo">
<h1>WaterBridge LMS</h1>
<p>회원 로그인</p>
</div>

<!-- 로그인만 -->
<div class="input-group">
<label>이메일</label>
<input
  type="email"
  id="loginEmail"
  placeholder="example@email.com"
  onkeypress="if(event.key==='Enter') login()"
>
</div>

<div class="input-group">
<label>비밀번호</label>
<input
  type="password"
  id="loginPassword"
  placeholder="비밀번호"
  onkeypress="if(event.key==='Enter') login()"
>
</div>

<button class="btn login-btn" onclick="login()">로그인</button>

<button class="btn signup-btn" onclick="goSignup()">회원가입</button>

<button class="btn reset-btn" onclick="resetPassword()">비밀번호 찾기</button>

<div class="msg" id="msg"></div>

<div class="footer">© WaterBridge LMS</div>

</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyDMn3t5QHpOSVqdAXsf8Bbh5TwXPqYIfpg",
  authDomain: "waterbridge-lms.firebaseapp.com",
  projectId: "waterbridge-lms",
  storageBucket: "waterbridge-lms.appspot.com",
  messagingSenderId: "224313355988",
  appId: "1:224313355988:web:886787fb9402df4f8e9541"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const ADMIN_EMAIL = "admin@waterbridge.com";

window.login = async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  if (!email || !password) {
    document.getElementById("msg").innerText = "이메일 및 비밀번호를 입력해주세요.";
    return;
  }

  try {
    const userCredential =
      await signInWithEmailAndPassword(auth, email, password);

    const user = userCredential.user;

    if (!user.emailVerified) {
      document.getElementById("msg").innerText = "이메일 인증 후 로그인해주세요.";
      return;
    }

    const snap = await getDoc(doc(db, "users", user.uid));

    if (snap.exists()) {
      const data = snap.data();

      if (data.role === "admin") {
        location.href = "admin.html";
      } else {
        location.href = "user.html";
      }
    } else {
      location.href = "user.html";
    }

  } catch (e) {
    let msg = "로그인 오류";

    switch (e.code) {
      case "auth/user-not-found":
        msg = "가입되지 않은 이메일입니다.";
        break;
      case "auth/wrong-password":
      case "auth/invalid-credential":
        msg = "비밀번호가 올바르지 않습니다.";
        break;
    }

    document.getElementById("msg").innerText = msg;
  }
};

window.goSignup = () => {
  location.href = "signup.html";
};

window.resetPassword = async () => {
  const email = document.getElementById("loginEmail").value;

  if (!email) {
    document.getElementById("msg").innerText = "이메일 입력해주세요.";
    return;
  }

  await sendPasswordResetEmail(auth, email);
  document.getElementById("msg").innerText = "메일 전송 완료";
};

</script>

</body>
</html> 수정해줘
