<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaterBridge LMS 로그인</title>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Pretendard',sans-serif;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:100%;
max-width:420px;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.logo{
text-align:center;
margin-bottom:30px;
}

.logo h1{
font-size:30px;
color:#2563eb;
}

.logo p{
color:#666;
margin-top:5px;
}

.input-group{
margin-bottom:15px;
}

.input-group label{
display:block;
margin-bottom:6px;
font-weight:600;
}

.input-group input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:600;
cursor:pointer;
margin-top:10px;
}

.login-btn{
background:#2563eb;
color:white;
}

.signup-btn{
background:#10b981;
color:white;
}

.reset-btn{
background:#f59e0b;
color:white;
}

.msg{
margin-top:15px;
text-align:center;
font-size:14px;
font-weight:600;
}

.footer{
margin-top:20px;
text-align:center;
color:#888;
font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
<h1>WaterBridge LMS</h1>
<p>회원 로그인</p>
</div>

<!-- 로그인만 -->
<div class="input-group">
<label>이메일</label>
<input type="email" id="loginEmail" placeholder="example@email.com">
</div>

<div class="input-group">
<label>비밀번호</label>
<input type="password" id="loginPassword" placeholder="비밀번호">
</div>

<button class="btn login-btn" onclick="login()">로그인</button>

<button class="btn signup-btn" onclick="goSignup()">회원가입</button>

<button class="btn reset-btn" onclick="resetPassword()">비밀번호 찾기</button>

<div class="msg" id="msg"></div>

<div class="footer">© WaterBridge LMS</div>

</div>

<!-- Firebase -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getAuth,
signInWithEmailAndPassword,
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyDMn3t5QHpOSVqdAXsf8Bbh5TwXPqYIfpg",
authDomain: "waterbridge-lms.firebaseapp.com",
projectId: "waterbridge-lms",
storageBucket: "waterbridge-lms.appspot.com",
messagingSenderId: "224313355988",
appId: "1:224313355988:web:886787fb9402df4f8e9541"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const ADMIN_EMAIL = "admin@waterbridge.com";

window.login = async () => {

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  // 🔥 1차 방어
  if (!email || !password) {
    document.getElementById("msg").innerText = "이메일/비밀번호 입력 필요";
    return;
  }

  // 🔥 이메일 형식 체크 (핵심)
  if (!email.includes("@")) {
    document.getElementById("msg").innerText = "이메일 형식이 잘못됨";
    return;
  }

  try {

    await signInWithEmailAndPassword(auth, email, password);

    document.getElementById("msg").innerText = "로그인 성공";

    if (email === ADMIN_EMAIL) {
      location.href = "/admin.html";
    } else {
      location.href = "/user.html";
    }

  } catch (e) {
    console.log(e.code, e.message);
    document.getElementById("msg").innerText = e.message;
  }
};

window.goSignup = () => {
location.href = "/signup.html";
};

window.resetPassword = async () => {

const email = document.getElementById("loginEmail").value;

if(!email){
document.getElementById("msg").innerText = "이메일 입력 필요";
return;
}

try{
await sendPasswordResetEmail(auth,email);
document.getElementById("msg").innerText = "메일 전송 완료";
}catch(e){
document.getElementById("msg").innerText = e.message;
}

};

</script>

</body>
</html>
