<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaterBridge LMS 학습</title>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,'Pretendard',sans-serif;background:#0f172a;color:#1f2937;min-height:100vh}
.topbar{height:58px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.brand{font-weight:700;font-size:17px;display:flex;gap:10px;align-items:center}
.brand-mark{width:28px;height:28px;background:#fff;color:#111827;border-radius:4px;display:grid;place-items:center;font-weight:800}
.back-btn{border:1px solid rgba(255,255,255,.18);background:#1f2937;color:#fff;border-radius:6px;padding:9px 12px;cursor:pointer}
.container{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
.learning-card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #d9dee7;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.head{padding:18px 22px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.head h1{font-size:22px;margin-bottom:6px}.head p{color:#6b7280;line-height:1.5}
.badge{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.video-frame{width:100%;aspect-ratio:16/9;background:#000}
.footer{padding:14px 22px;color:#6b7280;font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid #e5e7eb}
.quiz-panel{display:none;padding:24px}.quiz-mode .video-frame,.quiz-mode .footer{display:none}.quiz-mode .quiz-panel{display:block}
.quiz-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}.quiz-head strong{font-size:20px}.quiz-head p{color:#6b7280;line-height:1.5;margin-top:5px}
.quiz-count{border:1px solid #d9dee7;background:#f9fafb;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.quiz-question{font-size:20px;line-height:1.45;font-weight:700;margin-bottom:16px}.quiz-options{display:grid;gap:9px}
.quiz-option{width:100%;text-align:left;background:#fff;border:1px solid #d9dee7;border-radius:8px;padding:14px;font-weight:600;cursor:pointer}
.quiz-option.correct{background:#ecfdf5;border-color:#86efac;color:#166534}.quiz-option.wrong{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.quiz-feedback{display:none;margin-top:14px;border:1px solid #d9dee7;background:#f9fafb;border-radius:8px;padding:13px;color:#4b5563;line-height:1.5}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:#111827;color:#fff;border-radius:6px;padding:10px 14px;transition:.2s;z-index:120}.toast.show{transform:translateX(-50%) translateY(0)}
.notice{margin-top:14px;color:#cbd5e1;font-size:13px;line-height:1.6;text-align:center}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">W</span><span>WaterBridge LMS</span></div><button class="back-btn" onclick="goHome()">학습 나가기</button></header>
<main class="container">
<section class="learning-card" id="learningCard">
<div class="head"><div><h1 id="courseTitle">강의 학습</h1><p id="courseDesc">강의 정보를 불러오는 중입니다.</p></div><span class="badge" id="courseLevel">학습중</span></div>
<div class="video-frame" id="videoFrame"></div>
<div class="footer"><span id="watchTimeText">시청 시간 0초</span><span>영상 이동·속도 조작 감지 시 처음부터 다시 시청해야 합니다.</span></div>
<div class="quiz-panel"><div class="quiz-head"><div><strong id="quizTitle">영상 퀴즈</strong><p>정답을 맞혀야 다음 문항으로 이동합니다. 틀리면 1번부터 다시 시작합니다.</p></div><span class="quiz-count" id="quizCount">1 / 10</span></div><div class="quiz-question" id="quizQuestion"></div><div class="quiz-options" id="quizOptions"></div><div class="quiz-feedback" id="quizFeedback"></div></div>
</section>
<p class="notice">영상과 퀴즈를 모두 완료하면 자동으로 본 페이지로 돌아갑니다.</p>
</main>
<div class="toast" id="toast">알림</div>
<script>
const DEFAULT_COURSES=[{"id":"asset_admin_intro","title":"자산 행정 매니저 입문","desc":"직무 역할, 고객 방문 원칙, 업무 범위와 기본 윤리","level":"1단계","url":"https://www.youtube.com/embed/ysz5S6PUM-U?autoplay=1","required":null},{"id":"securities_basic","title":"증권 기초 이해","desc":"주식, 채권, 펀드, 증권계좌 등 핵심 개념 정리","level":"2단계","url":"https://www.youtube.com/embed/ysz5S6PUM-U?autoplay=1","required":"asset_admin_intro"},{"id":"ownership_transfer","title":"명의이전·소유권 이전 절차","desc":"증권 명의변경, 서류 흐름, 확인 항목 이해","level":"3단계","url":"https://www.youtube.com/embed/ysz5S6PUM-U?autoplay=1","required":"securities_basic"},{"id":"customer_visit","title":"고객 방문 및 응대 실무","desc":"방문 전 확인, 본인확인, 설명 방식, 민원 예방","level":"4단계","url":"https://www.youtube.com/embed/ysz5S6PUM-U?autoplay=1","required":"ownership_transfer"},{"id":"document_review","title":"서류 확인 및 검수 실무","desc":"신분 확인, 서명·날인 확인, 누락·오류 대응","level":"5단계","url":"https://www.youtube.com/embed/ysz5S6PUM-U?autoplay=1","required":"customer_visit"},{"id":"asset_handover","title":"자산·서류 인수인계 관리","desc":"인계 기록, 보관 원칙, 전달 보고와 책임 관리","level":"6단계","url":"https://www.youtube.com/embed/ysz5S6PUM-U?autoplay=1","required":"document_review"},{"id":"privacy_compliance","title":"개인정보보호 및 컴플라이언스","desc":"개인정보 처리 원칙, 보안, 내부 규정, 사고 예방","level":"7단계","url":"https://www.youtube.com/embed/ysz5S6PUM-U?autoplay=1","required":"asset_handover"},{"id":"final_assessment","title":"최종 실무 평가 과정","desc":"증권 행정, 고객 응대, 서류 검수, 보고 절차 종합 평가","level":"8단계","url":"https://www.youtube.com/embed/ysz5S6PUM-U?autoplay=1","required":"privacy_compliance"}];
const COURSES=JSON.parse(localStorage.getItem("wb_lms_courses")||"null")||DEFAULT_COURSES;
const WATCH_SECONDS_FOR_COMPLETE=20;
let latestUserData=JSON.parse(localStorage.getItem("wb_lms_data")||'{"completedCourseIds":[],"videoProgress":{}}');
let courseId=new URLSearchParams(location.search).get("course");
let course=COURSES.find(c=>c.id===courseId)||COURSES[0];
let ytPlayer=null,videoTimer=null,guardTimer=null,currentTime=0,safeSeconds=0,videoEnded=false,quizMode=false,quizIndex=0;
function onYouTubeIframeAPIReady(){loadPlayer()}
function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function formatSeconds(sec){const m=Math.floor(sec/60),s=sec%60;return m?`${m}분 ${s}초`:`${s}초`}
function getYoutubeId(url){const m=String(url||"").match(/embed\/([^?&]+)/);return m?m[1]:"ysz5S6PUM-U"}
function createQuiz(c){const t=c.title,d=c.desc;return[{question:`${t}에서 가장 핵심적으로 이해해야 할 내용은?`,options:[d,"개인 판단으로 처리","외부 공유","보고 생략"],answer:0},{question:`${t} 업무를 진행할 때 가장 중요한 원칙은?`,options:["정확한 확인과 기록","빠른 임의 처리","구두 약속만 의존","보안 생략"],answer:0},{question:`${t}와 관련해 고객에게 설명할 때 올바른 방식은?`,options:["쉽고 정확하게 설명한다","전문용어만 빠르게 말한다","질문을 무시한다","서류를 보여주지 않는다"],answer:0},{question:`${t} 진행 중 정보가 맞지 않으면 어떻게 해야 하나?`,options:["업무를 멈추고 관리자에게 확인한다","그대로 진행한다","임의로 수정한다","고객에게 숨긴다"],answer:0},{question:`${t}에서 기록을 남겨야 하는 이유는?`,options:["업무 추적과 책임 확인을 위해","형식만 맞추기 위해","개인 보관을 위해","외부 홍보를 위해"],answer:0},{question:`${t}에서 개인정보 처리 원칙으로 맞는 것은?`,options:["필요한 범위에서 안전하게 처리한다","개인 메신저로 자유롭게 보낸다","외부에 공유한다","퇴사 후 보관한다"],answer:0},{question:`${t} 업무에서 하면 안 되는 행동은?`,options:["무단 처리 또는 대리 서명","본인확인","서류 검수","관리자 보고"],answer:0},{question:`${t} 완료 후 필요한 조치는?`,options:["결과와 특이사항을 보고한다","보고를 생략한다","서류를 개인 보관한다","관련 기록을 삭제한다"],answer:0},{question:`${t}에서 판단이 애매할 때 올바른 대응은?`,options:["규정과 관리자 확인을 요청한다","혼자 결정한다","고객에게 숨긴다","무조건 진행한다"],answer:0},{question:`${t}의 최종 목적에 가장 가까운 것은?`,options:["안전하고 정확한 자산 행정 처리","수익 보장 약속","비공식 처리","고객 정보 수집"],answer:0}]}
function initPage(){document.getElementById("courseTitle").textContent=course.title;document.getElementById("courseDesc").textContent=course.desc;document.getElementById("courseLevel").textContent=course.level||"학습중";if(course.required&&!(latestUserData.completedCourseIds||[]).includes(course.required)){alert("이전 강의를 먼저 완료해야 합니다.");location.href="user.html";return}setTimeout(()=>{if(!ytPlayer)loadPlayer()},700)}
function loadPlayer(){if(!window.YT||!YT.Player)return;ytPlayer=new YT.Player("videoFrame",{videoId:getYoutubeId(course.url),playerVars:{autoplay:1,controls:1,disablekb:1,fs:0,rel:0,modestbranding:1,playsinline:1},events:{onReady:e=>{e.target.setPlaybackRate(1);e.target.playVideo();startProtection()},onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)finishVideo()},onPlaybackRateChange:e=>{if(e.target.getPlaybackRate()!==1)restartVideo("재생속도 조작이 감지되어 처음부터 다시 시작합니다.")}}})}
function startProtection(){clearInterval(videoTimer);clearInterval(guardTimer);videoTimer=setInterval(()=>{if(quizMode||!ytPlayer||!ytPlayer.getPlayerState)return;if(ytPlayer.getPlayerState()===YT.PlayerState.PLAYING){currentTime++;safeSeconds++;document.getElementById("watchTimeText").textContent="시청 시간 "+formatSeconds(currentTime);if(safeSeconds>=WATCH_SECONDS_FOR_COMPLETE&&!videoEnded)finishVideo()}},1000);guardTimer=setInterval(()=>{if(quizMode||!ytPlayer||!ytPlayer.getCurrentTime)return;const pt=ytPlayer.getCurrentTime()||0,rate=ytPlayer.getPlaybackRate?ytPlayer.getPlaybackRate():1;if(rate!==1){restartVideo("재생속도 조작이 감지되어 처음부터 다시 시작합니다.");return}if(pt>safeSeconds+4){restartVideo("영상 이동이 감지되어 처음부터 다시 시작합니다.");return}},600)}
function restartVideo(msg){clearInterval(videoTimer);clearInterval(guardTimer);currentTime=0;safeSeconds=0;document.getElementById("watchTimeText").textContent="시청 시간 0초";if(ytPlayer&&ytPlayer.seekTo){ytPlayer.seekTo(0,true);ytPlayer.setPlaybackRate(1);ytPlayer.playVideo()}showToast(msg||"조작이 감지되어 처음부터 다시 시작합니다.");startProtection()}
function finishVideo(){if(videoEnded)return;videoEnded=true;clearInterval(videoTimer);clearInterval(guardTimer);if(ytPlayer&&ytPlayer.stopVideo)ytPlayer.stopVideo();startQuiz()}
function startQuiz(){quizMode=true;quizIndex=0;document.getElementById("learningCard").classList.add("quiz-mode");document.getElementById("courseTitle").textContent=course.title+" 퀴즈";document.getElementById("quizTitle").textContent=course.title+" 퀴즈";renderQuiz()}
function renderQuiz(){const list=createQuiz(course),q=list[quizIndex];document.getElementById("quizCount").textContent=(quizIndex+1)+" / "+list.length;document.getElementById("quizQuestion").textContent=q.question;document.getElementById("quizOptions").innerHTML=q.options.map((opt,i)=>`<button class="quiz-option" type="button" onclick="answerQuiz(${i})">${opt}</button>`).join("");const fb=document.getElementById("quizFeedback");fb.style.display="none";fb.textContent=""}
function answerQuiz(selected){const list=createQuiz(course),q=list[quizIndex];document.querySelectorAll("#quizOptions .quiz-option").forEach((btn,i)=>{btn.disabled=true;if(i===q.answer)btn.classList.add("correct");if(i===selected&&i!==q.answer)btn.classList.add("wrong")});const fb=document.getElementById("quizFeedback");fb.style.display="block";if(selected===q.answer){fb.textContent="정답입니다. 다음 문항으로 이동합니다.";quizIndex++;setTimeout(()=>{if(quizIndex>=list.length)completeCourseAndReturn();else renderQuiz()},650)}else{fb.textContent="오답입니다. 1번 문항부터 다시 시작합니다.";setTimeout(()=>{quizIndex=0;renderQuiz();showToast("오답! 1번 문제로 돌아갑니다.")},900)}}
function completeCourseAndReturn(){if(!latestUserData.completedCourseIds.includes(course.id))latestUserData.completedCourseIds.push(course.id);latestUserData.videoProgress=latestUserData.videoProgress||{};latestUserData.videoProgress[course.id]=WATCH_SECONDS_FOR_COMPLETE;latestUserData.point=(latestUserData.completedCourseIds.length||0)*1000;localStorage.setItem("wb_lms_data",JSON.stringify(latestUserData));showToast("퀴즈 완료! 본 페이지로 이동합니다.");setTimeout(()=>{location.href="user.html"},900)}
function goHome(){if(confirm("학습을 종료하고 본 페이지로 돌아가시겠습니까?"))location.href="user.html"}
document.addEventListener("keydown",e=>{if(!quizMode&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){e.preventDefault();restartVideo("화살표 키 조작이 감지되어 처음부터 다시 시작합니다.")}},true);
window.addEventListener("beforeunload",()=>{clearInterval(videoTimer);clearInterval(guardTimer)});
initPage();
</script>
</body>
</html>
