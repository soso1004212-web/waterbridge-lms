<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaterBridge LMS</title>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',sans-serif;}
body{background:#f5f7fb;}

.header{height:70px;background:#0f172a;color:white;display:flex;justify-content:space-between;align-items:center;padding:0 30px;}
.logo{font-size:24px;font-weight:700;}
.logout{background:#dc2626;color:white;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;}

.container{max-width:1400px;margin:auto;padding:30px;}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:30px;}
.card{background:white;padding:25px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,.08);}
.card h3{font-size:14px;color:#666;margin-bottom:10px;}
.value{font-size:30px;font-weight:700;color:#2563eb;}

.section{background:white;padding:25px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,.08);margin-bottom:25px;}

.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;}

.course-card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;overflow:hidden;}
.course-card.completed{border:2px solid #22c55e;background:#f0fdf4;}

.course-card.locked{opacity:0.4;pointer-events:none;filter:grayscale(1);}

.course-thumbnail{height:180px;background:#dbeafe;display:flex;justify-content:center;align-items:center;font-size:50px;}

.course-body{padding:20px;}
.course-title{font-size:18px;font-weight:700;margin-bottom:10px;}
.course-desc{color:#666;margin-bottom:15px;}

.watch-btn{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:10px;cursor:pointer;}
.course-card.completed .watch-btn{background:#9ca3af;cursor:not-allowed;}

.check-mark{margin-left:8px;color:#22c55e;font-weight:900;display:none;}

.video-modal{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.8);display:none;
justify-content:center;align-items:center;z-index:999;
}

.video-box{width:90%;max-width:900px;background:white;padding:20px;border-radius:15px;}
video{width:100%;border-radius:10px;}
.close-btn{margin-top:15px;background:#dc2626;color:white;border:none;padding:10px 15px;border-radius:8px;cursor:pointer;}
</style>
</head>

<body>

<div class="header">
  <div class="logo">WaterBridge LMS</div>
  <button class="logout" onclick="location.href='index.html'">로그아웃</button>
</div>

<div class="container">

<!-- 강의 -->
<div class="section">
<h2>강의 목록</h2>

<div class="course-grid">

<div class="course-card" data-course-id="lms_basic">
  <div class="course-thumbnail">🎓</div>
  <div class="course-body">
    <div class="course-title">보이스피싱 기초편 <span class="check-mark" id="check-lms_basic">✔</span></div>
    <div class="course-desc">실전 전화방어</div>
    <button class="watch-btn" onclick="openVideo('video1.mp4','lms_basic')">강의 시청</button>
  </div>
</div>

<div class="course-card locked" data-course-id="invest_basic">
  <div class="course-thumbnail">📚</div>
  <div class="course-body">
    <div class="course-title">보이스피싱 중급편 <span class="check-mark" id="check-invest_basic">✔</span></div>
    <div class="course-desc">실전 자산방어</div>
    <button class="watch-btn" onclick="openVideo('video2.mp4','invest_basic')">강의 시청</button>
  </div>
</div>

</div>
</div>

</div>

<!-- VIDEO MODAL -->
<div class="video-modal" id="videoModal">
  <div class="video-box">
    <video id="videoPlayer" controls></video>
    <button class="close-btn" onclick="closeVideo()">닫기</button>
  </div>
</div>

<script type="module">

import { auth, db } from "./firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import { doc, getDoc, updateDoc, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

window.arrayUnion = arrayUnion;
window.increment = increment;

let userRef = null;
let currentCourseId = null;

let video = document.getElementById("videoPlayer");

/* ---------------- 로그인 ---------------- */
onAuthStateChanged(auth, async (user) => {
  if(!user){
    location.href="index.html";
    return;
  }

  userRef = doc(db,"users",user.uid);
  window.userRef = userRef;

  const snap = await getDoc(userRef);
  const data = snap.data();

  applyProgress(data);
});

/* ---------------- 이어보기 + 자동재생 ---------------- */
async function openVideo(url, courseId){

  currentCourseId = courseId;

  const snap = await getDoc(userRef);
  const data = snap.data();

  const savedTime = data.videoProgress?.[courseId] || 0;

  document.getElementById("videoModal").style.display="flex";

  video.src = url;

  video.onloadedmetadata = () => {
    video.currentTime = savedTime;

    const playPromise = video.play();
    if(playPromise){
      playPromise.catch(()=>console.log("자동재생 제한"));
    }
  };

  startTracking();
}

/* ---------------- 진도 저장 ---------------- */
function startTracking(){

  video.ontimeupdate = async () => {

    if(!currentCourseId) return;

    const current = Math.floor(video.currentTime);

    if(current % 5 === 0){
      await updateDoc(userRef,{
        [`videoProgress.${currentCourseId}`]: current
      });
    }

    if(video.duration && current / video.duration > 0.9){
      completeCourse(currentCourseId);
    }
  };
}

/* ---------------- 완료 처리 ---------------- */
async function completeCourse(id){

  const snap = await getDoc(userRef);
  const data = snap.data();

  if(data.completedCourseIds?.includes(id)) return;

  await updateDoc(userRef,{
    completedCourseIds: arrayUnion(id),
    completedCourses: increment(1)
  });

  document.getElementById("check-"+id).style.display="inline-block";

  document.querySelector(`[data-course-id="${id}"]`)
    .classList.add("completed");
}

/* ---------------- 영상 닫기 ---------------- */
async function closeVideo(){

  video.pause();
  document.getElementById("videoModal").style.display="none";

  if(currentCourseId){
    await updateDoc(userRef,{
      [`videoProgress.${currentCourseId}`]: Math.floor(video.currentTime)
    });
  }

  currentCourseId=null;
}

/* ---------------- UI 반영 ---------------- */
function applyProgress(data){

  const completed = data.completedCourseIds || [];

  completed.forEach(id=>{
    document.getElementById("check-"+id).style.display="inline-block";
    document.querySelector(`[data-course-id="${id}"]`)
      ?.classList.add("completed");
  });

  if(!completed.includes("lms_basic")){
    document.querySelector(`[data-course-id="invest_basic"]`)
      .classList.add("locked");
  }
}

window.openVideo = openVideo;
window.closeVideo = closeVideo;

</script>

</body>
</html>
