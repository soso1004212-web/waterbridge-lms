<!DOCTYPE html>
<html lang="ko">
<head>

<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WaterBridge LMS</title>

<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>


.online-badge{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#22c55e;
  color:white;
  padding:10px 14px;
  border-radius:20px;
  font-size:13px;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  z-index:9999;
}
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Pretendard',sans-serif;
}

body{
background:#f5f7fb;
}

.header{
height:70px;
background:#0f172a;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 30px;
}

.logo{
font-size:24px;
font-weight:700;
}

.logout{
background:#dc2626;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
}

.container{
max-width:1400px;
margin:auto;
padding:30px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h3{
font-size:14px;
color:#666;
margin-bottom:10px;
}

.value{
font-size:30px;
font-weight:700;
color:#2563eb;
}

.section{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
margin-bottom:25px;
}

.section h2{
margin-bottom:20px;
}

.notice{
padding:15px;
background:#f8fafc;
border-left:4px solid #2563eb;
margin-bottom:10px;
border-radius:10px;
}

.course-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.course-card{
background:#fff;
border:1px solid #e5e7eb;
border-radius:15px;
overflow:hidden;
}

.course-thumbnail{
height:180px;
background:#dbeafe;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
}

.course-body{
padding:20px;
}

.course-title{
font-size:18px;
font-weight:700;
margin-bottom:10px;
}

.course-desc{
color:#666;
margin-bottom:15px;
}

.watch-btn{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

.progress-bar{
width:100%;
height:12px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.progress{
height:100%;
background:#22c55e;
width:65%;
}

.video-modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.video-box{
width:90%;
max-width:900px;
background:white;
padding:20px;
border-radius:15px;
}

.video-box iframe{
width:100%;
height:500px;
border:none;
}

.close-btn{
margin-top:15px;
background:#dc2626;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}
.menu-btn{
  display:none;
  font-size:26px;
  background:none;
  border:none;
  color:white;
  cursor:pointer;
}

.nav{
  display:flex;
  gap:10px;
  align-items:center;
}
@media (max-width:768px){
  .menu-btn{ display:block; }

  .nav{
    position:absolute;
    top:70px;
    right:0;
    width:100%;
    background:#0f172a;
    flex-direction:column;
    display:none;
    padding:15px;
  }

  .nav.active{
    display:flex;
  }
}
.check-mark{
  margin-left:8px;
  color:#22c55e;
  font-weight:900;
  display:none;
}

.course-card.completed{
  border:2px solid #22c55e;
  background:#f0fdf4;
}

.course-card.completed .watch-btn{
  background:#9ca3af;
  cursor:not-allowed;
}
.course-card.locked{
  opacity:0.4;
  pointer-events:none;
  filter:grayscale(1);
}

.lock-badge{
  font-size:12px;
  color:#ef4444;
  margin-top:5px;
}
.course-progress{
  height:6px;
  background:#e5e7eb;
  border-radius:10px;
  margin-top:10px;
  overflow:hidden;
}

.course-progress-bar{
  height:100%;
  background:#22c55e;
  width:0%;
}
</style>
</head>
<body>

<div class="header">

  <div class="logo">WaterBridge LMS</div>

  <button class="menu-btn" onclick="toggleMenu()">☰</button>

  <div class="nav" id="navMenu">
    <button class="logout" onclick="logout()">로그아웃</button>
  </div>

</div>

<div class="container">

<div class="cards">

<div class="card">
<h3>수강 강의</h3>
<div class="value" id="totalCourses">0</div>
</div>

<div class="card">
<h3>완료 강의</h3>
<div class="value" id="completedCourses">0</div>
</div>

<div class="card">
<h3>수강률</h3>
<div class="value" id="progressValue">0%</div>
</div>

<div class="card">
<h3>포인트</h3>
<div class="value" id="pointValue">0</div>
</div>

</div>

<div class="section">

<h2>내 정보</h2>

<p><strong>이름 :</strong> <span id="userName">로딩중...</span></p>
<p><strong>등급 :</strong> <span id="userGrade">로딩중...</span></p>
<p><strong>이메일 :</strong> <span id="userEmail">로딩중...</span></p>

</div>

<div class="section">

<h2>공지사항</h2>

<div class="notice">
신규 강의 "LMS 마스터 과정"이 업로드되었습니다.
</div>

<div class="notice">
시스템 점검 예정 : 6월 20일 새벽 2시
</div>

</div>

<div class="section">

<h2>내 학습 현황</h2>

<p>WaterBridge 투자 과정</p>

<div class="progress-bar">
  <div class="progress"></div>
</div>

<p class="progress-text">0% 완료</p>

</div>

<div class="section">

<h2>강의 목록</h2>

<div class="course-grid">

<div class="course-card" data-course-id="lms_basic">

<div class="course-thumbnail">
🎓
</div>

<div class="course-body">

<div class="course-title">
보이스피싱 기초편
<span class="check-mark" id="check-lms_basic"></span>
</div>

<div class="course-desc">
실전 전화방어
</div>

<button class="watch-btn"
onclick="openVideo('https://www.youtube.com/embed/dQw4w9WgXcQ','lms_basic')">
강의 시청
</button>

</div>

</div>

<div class="course-card locked" data-course-id="invest_basic">

<div class="course-thumbnail">
📚
</div>

<div class="course-body">

<div class="course-title">
보이스피싱 중급편
<span class="check-mark" id="check-invest_basic"></span>
</div>

<div class="course-desc">
실전 자산방어
</div>

<div class="lock-badge" id="resume-lms_basic"></div>
<button class="watch-btn"
onclick="openVideo('https://www.youtube.com/embed/dQw4w9WgXcQ','invest_basic')">
강의 시청
</button>

</div>

</div>

</div>

</div>

</div>

<div class="video-modal" id="videoModal">

<div class="video-box">

<iframe id="videoFrame"
allowfullscreen>
</iframe>

<button class="close-btn"
onclick="closeVideo()">
닫기
</button>

</div>

</div>

<script>
function logout(){
  if(window.userRef){
    setDoc(window.userRef, {
      online: false,
      lastSeen: Date.now()
    }, { merge: true });
  }

  location.replace("index.html"); // ✔ 중요
}

function toggleMenu(){
  document.getElementById("navMenu").classList.toggle("active");
}

let currentCourseId = null;
let videoInterval = null;
let currentTime = 0;

/* -------------------------
   UI: 완료 표시
--------------------------*/
function renderCompletedCourses(data){
  const completed = data.completedCourseIds || [];

  completed.forEach(id => {

    const check = document.getElementById("check-" + id);
    if(check){
      check.textContent = "✔";
      check.style.display = "inline-block";
    }

    const card = document.querySelector(`[data-course-id="${id}"]`);
    if(card){
      card.classList.add("completed");
    }

  });
}

/* -------------------------
   UI: 버튼 비활성화
--------------------------*/
function disableCompletedButtons(data){
  const completed = data.completedCourseIds || [];

  completed.forEach(id => {

    const card = document.querySelector(`[data-course-id="${id}"]`);
    if(card){
      const btn = card.querySelector(".watch-btn");
      if(btn){
        btn.textContent = "완료됨";
        btn.disabled = true;
      }
    }

  });
}

/* -------------------------
   강의 잠금
--------------------------*/
function applyCourseLock(data){

  const completed = data.completedCourseIds || [];

  const invest = document.querySelector(`[data-course-id="invest_basic"]`);

  if(invest && !completed.includes("lms_basic")){
    invest.classList.add("locked");
  }
}

/* -------------------------
   🚀 핵심: 이어보기 + 자동재생
--------------------------*/
async function openVideo(url, courseId){

const courseTitles = {
  lms_basic: "보이스피싱 기초편",
  invest_basic: "보이스피싱 중급편"
};

  currentCourseId = courseId;

  const video = document.getElementById("videoFrame");

  // iframe → video로 변환 없이 iframe 유지 (유지형 개선)
  video.src = url;

  document.getElementById("videoModal").style.display = "flex";

  const snap = await window.getDoc(window.userRef);
  const data = snap.data();

  currentTime = data.videoProgress?.[courseId] || 0;

  // iframe이라 강제 sync (유튜브 기준 간접 처리)
  startTracking();
}

/* -------------------------
   가짜 진행 추적 (iframe 대응)
--------------------------*/
function startTracking(){

  clearInterval(videoInterval);

  videoInterval = setInterval(() => {

    currentTime += 1;

    if(currentTime % 5 === 0 && currentCourseId){

      window.updateDoc(window.userRef, {
        [`videoProgress.${currentCourseId}`]: currentTime
      });
    }

    if(currentTime >= 480){
      markAsCompleted();
    }

  }, 1000);
}

/* -------------------------
   완료 처리
--------------------------*/
async function markAsCompleted(){

  if(!currentCourseId) return;

  const userRef = window.userRef;
  const snap = await window.getDoc(userRef);
  const data = snap.data();

  if(data.completedCourseIds?.includes(currentCourseId)){
    return;
  }

  await window.updateDoc(userRef, {
    completedCourseIds: window.arrayUnion(currentCourseId),
    completedCourses: window.increment(1)
  });

  clearInterval(videoInterval);

  renderCompletedCourses(data);
  disableCompletedButtons(data);
}

/* -------------------------
   영상 닫기 + 진도 저장
--------------------------*/
async function closeVideo(){

  document.getElementById("videoFrame").src = "";
  document.getElementById("videoModal").style.display = "none";

  clearInterval(videoInterval);

  if(!currentCourseId) return;
await updateDoc(window.userRef, {
  currentCourse: null,
  currentCourseTitle: null,
  lastSeen: Date.now()
});

  await window.updateDoc(window.userRef, {
    [`videoProgress.${currentCourseId}`]: currentTime
  });

  currentCourseId = null;
}
</script>

<script type="module">


onAuthStateChanged(auth, (user) => {
  if(!user){
    location.replace("index.html");
  }
});

import { auth, db } from "./firebase-config.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  doc,
  getDoc,
  updateDoc,
  setDoc,
  arrayUnion,
  increment
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

window.arrayUnion = arrayUnion;
window.increment = increment;

window.getDoc = getDoc;
window.updateDoc = updateDoc;

let userRef = null;
window.userRef = null;
window.currentUser = null;

window.setOnlineStatus = async function(courseId, courseTitles) {
  if(!window.userRef) return;

  await updateDoc(window.userRef, {
    currentCourse: courseId,
    currentCourseTitle: courseTitles?.[courseId] || "강의 시청중",
    online: true,
    lastSeen: Date.now()
  });
};

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    location.replace("index.html");
    return;
  }

  window.currentUser = user;
  window.userRef = doc(db, "users", user.uid);

  const snap = await getDoc(window.userRef);
  if (!snap.exists()) return;

  const data = snap.data();

  // ✅ 여기서 연결 상태 바꾸기
  document.getElementById("onlineStatus").innerText = "🟢 온라인";

  // UI 업데이트는 여기 안으로 넣어야 안전
  document.getElementById("userName").textContent = data.name || "";
  document.getElementById("userGrade").textContent = data.grade || "";
  document.getElementById("userEmail").textContent = data.email || "";

  document.getElementById("totalCourses").textContent = data.totalCourses || 0;
  document.getElementById("completedCourses").textContent = data.completedCourses || 0;

  const total = data.totalCourses || 1;
  const completed = data.completedCourses || 0;

  const progress = Math.round((completed / total) * 100);

  document.getElementById("progressValue").textContent = progress + "%";
  document.querySelector(".progress").style.width = progress + "%";
  document.querySelector(".progress-text").textContent = progress + "% 완료";

  document.getElementById("pointValue").textContent =
    (data.point || 0).toLocaleString();

  applyCourseLock(data);
  renderCompletedCourses(data);
  disableCompletedButtons(data);
});
  document.getElementById("userGrade").textContent = data.grade || "";
  document.getElementById("userEmail").textContent = data.email || "";

  document.getElementById("totalCourses").textContent = data.totalCourses || 0;
  document.getElementById("completedCourses").textContent = data.completedCourses || 0;

  const total = data.totalCourses || 1;
  const completed = data.completedCourses || 0;

  const progress = Math.round((completed / total) * 100);

  document.getElementById("progressValue").textContent = progress + "%";
  document.querySelector(".progress").style.width = progress + "%";
  document.querySelector(".progress-text").textContent = progress + "% 완료";

  document.getElementById("pointValue").textContent =
    (data.point || 0).toLocaleString();

});

window.addEventListener("beforeunload", async () => {
  if (window.userRef) {
    await setDoc(window.userRef, {
      online: false,
      lastSeen: Date.now()
    }, { merge: true });
  }
});

window.addEventListener("pageshow", (event) => {
  if (event.persisted) {
    location.reload();
  }
});

</script>

<div class="online-badge" id="onlineStatus">
  🔄 연결중...
</div>
</body>
</html>
